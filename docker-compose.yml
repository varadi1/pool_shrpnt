version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pooldrv
      POSTGRES_PASSWORD: pooldrv
      POSTGRES_DB: pooldrv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pooldrv"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POOLDRV_DATABASE_URL: postgresql://pooldrv:pooldrv@postgres:5432/pooldrv
      POOLDRV_REDIS_URL: redis://redis:6379/0
      POOLDRV_CELERY_BROKER_URL: redis://redis:6379/1
      POOLDRV_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./libs:/app/libs

  worker:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.worker
    env_file:
      - .env
    environment:
      POOLDRV_DATABASE_URL: postgresql://pooldrv:pooldrv@postgres:5432/pooldrv
      POOLDRV_REDIS_URL: redis://redis:6379/0
      POOLDRV_CELERY_BROKER_URL: redis://redis:6379/1
      POOLDRV_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./worker:/app/worker
      - ./api:/app/api
      - ./libs:/app/libs

volumes:
  postgres_data: